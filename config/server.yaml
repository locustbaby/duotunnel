server:
  tunnel_port: 10086
  h2_single_authority: true
  log_level: "debug"
  trace_enabled: false
  tcp:
    nodelay: true
  quic:
    max_concurrent_streams: 1000
    keepalive_secs: 20
    idle_timeout_secs: 180
  http_pool:
    idle_timeout_secs: 90
    max_idle_per_host: 128
  proxy_buffers:
    peek_buf_size: 16384
  pki:
    cert_cache_ttl_secs: 3600
