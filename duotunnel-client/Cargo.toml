[package]
name = "duotunnel-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
path = "lib.rs"

[[bin]]
name = "duotunnel-client"
path = "main.rs"

[features]
default = []
dial9-telemetry = ["dep:dial9-tokio-telemetry"]

[dependencies]
duotunnel-lib = { path = "../duotunnel-lib" }
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
quinn = { version = "0.11", default-features = false, features = ["log", "platform-verifier", "runtime-tokio", "rustls-aws-lc-rs", "bloom"] }
parking_lot = "0.12"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
tokio-rustls = "0.26"
webpki-roots = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4.6", features = ["derive"] }
dashmap = "6.1"
bytes = "1.9"
httparse = "1.9"
hyper = { version = "1.9", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", features = ["http2", "aws-lc-rs"] }
rustls-native-certs = "0.8"
http-body-util = "0.1"
futures-util = "0.3"
async-trait = "0.1"
http = "1.0"
arc-swap = "1.9"
figment = { version = "0.10", features = ["yaml", "env"] }
rand = "0.9"
mimalloc = "0.1"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
dial9-tokio-telemetry = { version = "0.3.11", features = ["cpu-profiling"], optional = true }
