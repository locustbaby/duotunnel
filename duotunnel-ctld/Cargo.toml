[package]
name = "duotunnel-ctld"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "duotunnel-ctld"
path = "src/main.rs"

[dependencies]
duotunnel-lib = { path = "../duotunnel-lib" }
# The published SQLx 0.9 release cannot resolve a patched SQLite wrapper.
sqlx = { git = "https://github.com/transact-rs/sqlx.git", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c", default-features = false, features = ["runtime-tokio", "sqlite"] }
libsqlite3-sys = { version = "0.39.1", default-features = false }
tokio = { version = "1.52", features = ["full"] }
async-trait = "0.1"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
figment = { version = "0.10", features = ["yaml", "env"] }
arc-swap = "1.9"
subtle = "2"
hex = "0.4"
sha2 = "0.11"
base64 = "0.22"
rand = "0.9"
