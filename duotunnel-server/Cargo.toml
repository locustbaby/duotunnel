[package]
name = "duotunnel-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
path = "lib.rs"

[[bin]]
name = "duotunnel-server"
path = "main.rs"

[features]
default = []
dial9-telemetry = ["dep:dial9-tokio-telemetry"]

[dependencies]
duotunnel-lib = { path = "../duotunnel-lib" }
subtle = "2"
hex = "0.4"
tokio = { version = "1.52", features = ["full", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
quinn = { version = "0.11", default-features = false, features = ["log", "platform-verifier", "runtime-tokio", "rustls-aws-lc-rs", "bloom"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
webpki-roots = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4.6", features = ["derive"] }
dashmap = "6.1"
bytes = "1.9"
httparse = "1.9"
rcgen = "0.14"
hyper = { version = "1.9", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", features = ["http2", "aws-lc-rs"] }
http-body-util = "0.1"
async-trait = "0.1"
tokio-rustls = "0.26"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
arc-swap = "1.9"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
fastrand = "2.0"
mimalloc = "0.1"
dial9-tokio-telemetry = { version = "0.3.11", features = ["cpu-profiling"], optional = true }
serde_json = "1.0.150"
