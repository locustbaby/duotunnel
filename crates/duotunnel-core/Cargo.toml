[package]
name = "duotunnel-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
quinn = { version = "0.11", default-features = false, features = ["log", "platform-verifier", "runtime-tokio", "rustls-aws-lc-rs", "bloom"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
rcgen = { version = "0.14", features = ["x509-parser", "pem"] }
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7" }
tracing = { version = "0.1" }
serde = { version = "1.0", features = ["derive", "rc"] }
base64 = "0.22"
rkyv = { version = "0.8.15", default-features = false, features = ["std", "bytecheck", "alloc"] }
anyhow = "1.0"
bytes = "1.9"
httparse = "1.9"
hyper = { version = "1.9", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", features = ["http2", "aws-lc-rs"] }
http-body-util = "0.1"
futures-util = "0.3"
async-trait = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
http = "1.0"
arc-swap = "1.9"
crossbeam-utils = "0.8"
crossbeam-queue = "0.3"
dashmap = "6.1"
parking_lot = "0.12"
tokio-rustls = "0.26"
webpki-roots = "1.0"
fluke-hpack = "0.3"
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
pin-project-lite = "0.2"
fastrand = "2.4.1"
serde_json = "1.0.150"
sha2 = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "copy_throughput"
harness = false
