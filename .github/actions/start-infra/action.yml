name: 'Start DuoTunnel Infrastructure'
description: 'Initialize /etc/hosts, echo backends, and full tunnel system'
inputs:
  worker_threads:
    description: 'Parallelism anchor. 0 = auto (cgroup CPUQuota caps derived values). N>0 sets TOKIO_WORKER_THREADS request. Runtime resolves accept_workers/shards/connections from effective_runtime_parallelism().'
    default: '0'
  cpu_quota:
    description: 'systemd CPUQuota for server/client scopes. Empty → STRESS_CPU_QUOTA env (default 100% = 1 CPU). none/unlimited/0 = no cap.'
    default: ''
  tun_config_dir:
    description: 'Directory for configs'
    default: 'ci-helpers/configs'

runs:
  using: "composite"
  steps:
    - name: Configure /etc/hosts
      shell: bash
      run: |
        {
          echo "127.0.0.1  echo.local"
          echo "127.0.0.1  ws.local"
          echo "127.0.0.1  grpc.local"
          echo "127.0.0.1  echo.beeceptor.test"
          echo "127.0.0.1  ws.ext.test"
          echo "127.0.0.1  grpc.ext.test"
          for i in $(seq -w 01 60); do
            echo "127.0.0.1  echo-${i}.local"
          done
        } | sudo tee -a /etc/hosts

    - name: Start echo backends
      shell: bash
      run: |
        ./target/release/http-echo-server 9999  > /tmp/http-echo.log  2>&1 & echo $! > /tmp/http-echo.pid
        ./target/release/ws-echo-server   8765  > /tmp/ws-echo.log    2>&1 & echo $! > /tmp/ws-echo.pid
        ./target/release/grpc-echo-server 50051 > /tmp/grpc-echo.log  2>&1 & echo $! > /tmp/grpc-echo.pid
        for i in $(seq 1 20); do
          curl -sf --max-time 1 http://127.0.0.1:9999/ > /dev/null && break
          sleep 0.2
        done
        sleep 0.5
        echo "Backends ready"

    - name: Start Tunnel control plane
      shell: bash
      run: |
        mkdir -p data
        ./target/release/duotunnel-ctld --config ${{ inputs.tun_config_dir }}/ctld.yaml > /tmp/ci-ctld.log 2>&1 &
        echo $! > /tmp/ctld.pid
        for i in $(seq 1 60); do
          curl -sf --max-time 1 http://127.0.0.1:9091/healthz > /dev/null 2>&1 && break
          sleep 0.5
        done

        CPU_QUOTA="${{ inputs.cpu_quota }}"
        if [ -z "$CPU_QUOTA" ]; then
          CPU_QUOTA="${STRESS_CPU_QUOTA:-100%}"
        fi

        QUOTA_ARG=()
        if [ -n "$CPU_QUOTA" ] && [ "$CPU_QUOTA" != "none" ] && [ "$CPU_QUOTA" != "unlimited" ] && [ "$CPU_QUOTA" != "0" ] && [ "$CPU_QUOTA" != "0%" ]; then
          QUOTA_ARG=(-p "CPUQuota=${CPU_QUOTA}")
        fi

        SERVER_TOKIO_ENV=()
        if [ -n "${{ inputs.worker_threads }}" ] && [ "${{ inputs.worker_threads }}" != "0" ]; then
          SERVER_TOKIO_ENV=(-E TOKIO_WORKER_THREADS="${{ inputs.worker_threads }}")
        fi

        sudo systemd-run --scope --unit=duotunnel-server --collect \
          "${QUOTA_ARG[@]}" -p CPUWeight=1024 -p MemoryMax=2G \
          "${SERVER_TOKIO_ENV[@]}" \
          -- ./target/release/duotunnel-server --config ${{ inputs.tun_config_dir }}/server.yaml \
          --ctld-addr 127.0.0.1:7788 >> /tmp/ci-server.log 2>&1 &
        for i in $(seq 1 60); do
          curl -sf --max-time 1 http://127.0.0.1:9090/healthz > /dev/null 2>&1 && break
          sleep 0.5
        done

        TOKEN=$(./target/release/duotunnel-ctld --config ${{ inputs.tun_config_dir }}/ctld.yaml \
          client create ci-group 2>/dev/null | grep '^Token:' | awk '{print $2}' \
          || ./target/release/duotunnel-ctld --config ${{ inputs.tun_config_dir }}/ctld.yaml \
          client rotate ci-group 2>/dev/null | awk '{print $NF}' | sed 's/\x1b\[[0-9;]*m//g')
        TOKEN=$(echo "$TOKEN" | tr -cd '[:print:]')
        printf '%s' "$TOKEN" > /tmp/ci-token

        sleep 3

        CLIENT_TOKIO_ENV=()
        if [ -n "${{ inputs.worker_threads }}" ] && [ "${{ inputs.worker_threads }}" != "0" ]; then
          CLIENT_TOKIO_ENV=(-E TOKIO_WORKER_THREADS="${{ inputs.worker_threads }}")
        fi
        CLIENT_TOKIO_ENV+=(-E DUOTUNNEL_CLIENT__AUTH_TOKEN="$TOKEN")

        sudo systemd-run --scope --unit=duotunnel-client --collect \
          "${QUOTA_ARG[@]}" -p CPUWeight=1024 -p MemoryMax=2G \
          "${CLIENT_TOKIO_ENV[@]}" \
          -- ./target/release/duotunnel-client --config ${{ inputs.tun_config_dir }}/client.yaml >> /tmp/ci-client.log 2>&1 &
        for i in $(seq 1 60); do
          systemctl is-failed duotunnel-client.scope > /dev/null 2>&1 && break
          curl -sf --max-time 1 http://127.0.0.1:9092/healthz > /dev/null 2>&1 && break
          sleep 0.5
        done

    - name: Warmup Verification
      shell: bash
      run: |
        WARMUP_PORT=8080
        chmod +x ci-helpers/warmup.sh
        ./ci-helpers/warmup.sh ctld "$WARMUP_PORT"
